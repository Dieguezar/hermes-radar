manifest_version: 1
name: radar
version: 0.6.0
description: >-
  Radar — live panel of every Hermes session across all profiles: state, current
  tool, elapsed time and a two-step stop for a hung turn. Each profile's
  state.db is opened read-only; the stop is a gateway RPC (session.interrupt)
  and can target any profile. No network, no telemetry, no credentials.
homepage: "https://github.com/Dieguezar/hermes-radar"
requires_hermes: ">=0.22"
platforms:
  - linux
  - windows
provides_tools: []
provides_hooks: []
requires_env: []
